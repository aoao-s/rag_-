# EduRAG-Pro 依赖服务（离线数据面）
#
# 启动：在仓库根执行
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#   或直接跑 scripts\docker_up.ps1
#
# 设计约定：
# 1) 端口/账号/库名全部取自仓库根 `.env`，容器与应用只有一个配置来源；
#    默认避开 3306 / 6379 / 19530 / 9000 / 3000——本机可能已有旧项目 rag-pro 的容器占着。
# 2) 每个服务 `pull_policy: never`：离线机器上只能靠 `docker load` 进来的镜像启动，绝不联网。
# 3) 数据落 `docker/volumes/`，`docker compose down` 不删数据；清空要显式 `down -v`。
# 4) qa_system 只依赖 mysql + redis；etcd/minio/milvus/attu 是 PR3 rag_system 的依赖。

name: edurag-pro

services:
  mysql:
    container_name: edurag-mysql
    image: mysql:8.0
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itcast}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      - --local-infile=1
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    container_name: edurag-redis
    image: redis:8.10
    pull_policy: never
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-1234}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------- 以下为 PR3 rag_system 的依赖，先起 mysql/redis 可忽略 ----------------

  etcd:
    container_name: edurag-etcd
    image: quay.io/coreos/etcd:v3.5.5
    pull_policy: never
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: edurag-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    pull_policy: never
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: edurag-milvus
    image: milvusdb/milvus:v2.4.0
    pull_policy: never
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-19541}:19530"
      - "${MILVUS_METRICS_PORT:-9092}:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  attu:
    container_name: edurag-attu
    image: zilliz/attu:v2.4.12
    pull_policy: never
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-3001}:3000"
    depends_on:
      - milvus
    restart: unless-stopped

networks:
  default:
    name: edurag-network
